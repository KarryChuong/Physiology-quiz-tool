<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trắc nghiệm Sinh lý</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1b2230;
      --muted: #5a6478;
      --border: #e2e6ef;
      --primary: #3d6bff;
      --primary-d: #2f55d4;
      --ok: #1f9d55;
      --ok-bg: #e4f7ec;
      --bad: #e0344b;
      --bad-bg: #fdeaed;
      --warn: #b8860b;
      --chip: #eef1f8;
      --shadow: 0 6px 20px rgba(30, 40, 70, .08);
    }

    :root[data-theme="dark"] {
      --bg: #0f1420;
      --card: #171d2b;
      --text: #e8ecf5;
      --muted: #9aa4ba;
      --border: #28303f;
      --primary: #5b82ff;
      --primary-d: #7a9bff;
      --ok: #37c47a;
      --ok-bg: #12301f;
      --bad: #ff5c73;
      --bad-bg: #341419;
      --warn: #e0b34d;
      --chip: #212a3a;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1420;
        --card: #171d2b;
        --text: #e8ecf5;
        --muted: #9aa4ba;
        --border: #28303f;
        --primary: #5b82ff;
        --primary-d: #7a9bff;
        --ok: #37c47a;
        --ok-bg: #12301f;
        --bad: #ff5c73;
        --bad-bg: #341419;
        --warn: #e0b34d;
        --chip: #212a3a;
        --shadow: 0 6px 24px rgba(0, 0, 0, .35);
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 16px
    }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 4px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 20
    }

    header.top h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: .2px
    }

    .iconbtn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: var(--shadow)
    }

    .iconbtn:hover {
      border-color: var(--primary)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px
    }

    .muted {
      color: var(--muted)
    }

    .hidden {
      display: none !important
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 15px;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      transition: .15s
    }

    .btn:hover {
      background: var(--primary-d)
    }

    .btn.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border)
    }

    .btn.ghost:hover {
      border-color: var(--primary)
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px
    }

    .topic {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: .15s;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .topic:hover {
      border-color: var(--primary);
      transform: translateY(-2px)
    }

    .topic b {
      font-size: 15px
    }

    .chip {
      background: var(--chip);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      color: var(--muted);
      align-self: flex-start
    }

    .opts label {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 6px 0;
      cursor: pointer
    }

    select,
    input[type=text] {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 14px
    }

    input[type=text] {
      width: 100%
    }

    .switchbar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden
    }

    .seg button {
      background: var(--card);
      border: none;
      padding: 9px 16px;
      cursor: pointer;
      color: var(--text);
      font-size: 14px
    }

    .seg button.active {
      background: var(--primary);
      color: #fff
    }

    /* Quiz */
    .progress {
      height: 8px;
      background: var(--chip);
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0
    }

    .progress>i {
      display: block;
      height: 100%;
      background: var(--primary);
      width: 0;
      transition: .3s
    }

    .qmeta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px
    }

    .badge {
      background: var(--warn);
      color: #fff;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 700
    }

    .qtext {
      font-size: 18px;
      font-weight: 600;
      margin: 12px 0 16px
    }

    .answer {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 15px;
      color: var(--text);
      transition: .12s
    }

    .answer:hover:not(.locked) {
      border-color: var(--primary)
    }

    .answer .key {
      flex: none;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--chip);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px
    }

    .answer.correct {
      border-color: var(--ok);
      background: var(--ok-bg)
    }

    .answer.correct .key {
      background: var(--ok);
      color: #fff
    }

    .answer.wrong {
      border-color: var(--bad);
      background: var(--bad-bg)
    }

    .answer.wrong .key {
      background: var(--bad);
      color: #fff
    }

    .answer.chosen {
      border-color: var(--primary)
    }

    .answer.locked {
      cursor: default
    }

    .feedback {
      font-weight: 700;
      margin: 6px 0 2px
    }

    .feedback.ok {
      color: var(--ok)
    }

    .feedback.bad {
      color: var(--bad)
    }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap
    }

    .counter b {
      color: var(--primary)
    }

    .scoreline {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 14px
    }

    .scoreline .ok {
      color: var(--ok);
      font-weight: 700
    }

    .scoreline .bad {
      color: var(--bad);
      font-weight: 700
    }

    .bk {
      color: var(--warn);
      cursor: pointer;
      font-size: 14px;
      user-select: none
    }

    /* Result */
    .bigscore {
      font-size: 46px;
      font-weight: 800;
      text-align: center
    }

    .review .qtext {
      font-size: 16px;
      margin: 4px 0 10px
    }

    .review .card {
      margin-bottom: 12px
    }

    .small {
      font-size: 13px
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 18px 0
    }

    kbd {
      background: var(--chip);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 12px
    }

    @media(max-width:600px) {
      .qtext {
        font-size: 16px
      }

      .bigscore {
        font-size: 38px
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="top">
      <h1>Trắc nghiệm Sinh lý</h1>
      <div class="row">
        <button class="iconbtn" id="btnBookmarks" title="Câu đã lưu">☆ Đã lưu</button>
        <button class="iconbtn" id="btnTheme" title="Đổi giao diện sáng/tối">🌗</button>
      </div>
    </header>

    <!-- ===== HOME ===== -->
    <section id="home">
      <div class="card">
        <div class="scoreline muted" id="homeStats"></div>
        <div style="margin-top:14px" class="switchbar">
          <div>
            <div class="small muted" style="margin-bottom:4px">Chế độ</div>
            <div class="seg" id="segMode">
              <button data-mode="practice" class="active">Luyện tập</button>
              <button data-mode="exam">Thi thử</button>
            </div>
          </div>
          <div>
            <div class="small muted" style="margin-bottom:4px">Số câu mỗi lần</div>
            <select id="selCount">
              <option value="10">10 câu</option>
              <option value="20">20 câu</option>
              <option value="30">30 câu</option>
              <option value="50" selected>50 câu</option>
              <option value="100">100 câu</option>
              <option value="0">Tất cả</option>
            </select>
          </div>
          <label class="opts" style="align-self:flex-end"><input type="checkbox" id="chkShuffleQ" checked> Trộn câu
            hỏi</label>
          <label class="opts" style="align-self:flex-end"><input type="checkbox" id="chkShuffleA" checked> Trộn đáp
            án</label>
        </div>
      </div>

      <div class="card">
        <input type="text" id="search" placeholder="🔎 Tìm câu hỏi theo từ khoá rồi Enter để luyện tập...">
        <div class="row" style="margin-top:12px">
          <button class="btn" id="btnAll">🎲 Trộn tất cả chủ đề</button>
          <button class="btn ghost" id="btnWrong">🔁 Ôn lại câu đã làm sai (<span id="wrongCount">0</span>)</button>
        </div>
      </div>

      <h3 style="margin:6px 4px">Chọn chủ đề</h3>
      <div class="grid" id="topicGrid"></div>
    </section>

    <!-- ===== QUIZ ===== -->
    <section id="quiz" class="hidden">
      <div class="card">
        <div class="qmeta">
          <span class="muted" id="quizTopic"></span>
          <span class="counter">Câu <b id="cIndex">1</b> / <span id="cTotal">0</span></span>
        </div>
        <div class="progress"><i id="bar"></i></div>
        <div class="scoreline">
          <span>✅ Đúng: <span class="ok" id="sCorrect">0</span></span>
          <span>❌ Sai: <span class="bad" id="sWrong">0</span></span>
          <span id="timerWrap" class="hidden">⏱ <span id="timer">0:00</span></span>
          <span class="bk" id="bkToggle">☆ Lưu câu này</span>
        </div>
      </div>

      <div class="card">
        <div class="qmeta">
          <span class="muted small" id="qLabel"></span>
          <span class="badge hidden" id="exceptBadge">NGOẠI TRỪ</span>
        </div>
        <div class="qtext" id="qText"></div>
        <div id="answers"></div>
        <div id="feedback"></div>
      </div>

      <div class="nav">
        <button class="btn ghost" id="btnPrev">← Câu trước</button>
        <div class="row">
          <button class="btn ghost" id="btnHome2">🏠 Trang chủ</button>
          <button class="btn" id="btnNext">Câu sau →</button>
          <button class="btn hidden" id="btnFinish">Nộp bài</button>
        </div>
      </div>
      <p class="small muted" style="text-align:center">Phím tắt: <kbd>1</kbd>–<kbd>9</kbd> hoặc
        <kbd>A</kbd>–<kbd>Z</kbd> chọn · <kbd>→</kbd>/<kbd>Enter</kbd> câu sau · <kbd>←</kbd> câu trước · <kbd>S</kbd>
        lưu câu
      </p>
    </section>

    <!-- ===== RESULT ===== -->
    <section id="result" class="hidden">
      <div class="card">
        <div class="bigscore" id="rScore"></div>
        <div class="scoreline" style="justify-content:center;margin-top:8px" id="rBreak"></div>
        <div class="row" style="justify-content:center;margin-top:16px">
          <button class="btn" id="btnRetryWrong">🔁 Làm lại câu sai</button>
          <button class="btn ghost" id="btnRestart">↻ Làm lại từ đầu</button>
          <button class="btn ghost" id="btnHome3">🏠 Trang chủ</button>
        </div>
      </div>
      <div class="review" id="review"></div>
    </section>

    <footer>Tự học Sinh lý · dữ liệu trích từ bộ 3000 câu · dùng offline, không cần internet</footer>
  </div>

  <script>

T SINH HỌC", "question": "Câu 1353. Hormon nào dưới đây có yếu tố điều hòa ngược dương tính (positive feedback)?", "options": ["ACTH", "Oxytocin", "TSH", "FSH"], "answers": [1], "isExcept": false }, { "id": 2085, "topic": "ĐẠI CƯƠNG VỀ HOẠT CHẤT SINH HỌC", "question": "Câu 1354. Cơ chế feedback dương trong điều hòa bài tiết cortisol xảy ra trong trường hợp nào sau đây:", "options": ["a. Đường huyết tăng", "b. Acid amin máu tăng", "c. Dị ứng", "d. Cơ thể bị stress"], "answers": [3], "isExcept": false }]; window.META = { "topics": [{ "name": "MỘT SỐ HOẠT CHẤT SINH HỌC NGOÀI TUYẾN NỘI TIẾT", "count": 32 }, { "name": "NHẬP MÔN VÀ ĐẠI CƯƠNG VỀ CƠ THỂ SỐNG", "count": 251 }, { "name": "SINH LÝ DỊCH CƠ THỂ", "count": 161 }, { "name": "SINH LÝ HỆ CƠ", "count": 155 }, { "name": "SINH LÝ HỆ THẦN KINH CẢM GIÁC", "count": 195 }, { "name": "SINH LÝ NƠRON VÀ SYNAP", "count": 2 }, { "name": "SINH LÝ NỘI TIẾT VÙNG HẠ ĐỒI", "count": 44 }, { "name": "SINH LÝ PHẢN XẠ", "count": 131 }, { "name": "SINH LÝ TẾ BÀO", "count": 241 }, { "name": "SINH LÝ THÂN NHIỆT", "count": 165 }, { "name": "SINH LÝ THẦN KINH CAO CẤP", "count": 143 }, { "name": "SINH LÝ TUYẾN GIÁP", "count": 51 }, { "name": "SINH LÝ TỤY NỘI TIẾT", "count": 78 }, { "name": "SINH LÝ XƯƠNG KHỚP", "count": 40 }, { "name": "VẬN CHUYỂN VẬT CHẤT QUA MÀNG TẾ BÀO", "count": 95 }, { "name": "ĐẠI CƯƠNG VỀ HOẠT CHẤT SINH HỌC", "count": 302 }], "total": 2086, "skipped": 458 };
  </script>
  <script>
    // ================== TIỆN ÍCH ==================
    var LS = {
      get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
      set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
    };
    function $(id) { return document.getElementById(id); }
    function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    var LETTERS = 'ABCDEFGHIJKLMNOP';

    var QS = window.QUESTIONS || [];
    var META = window.META || { topics: [], total: QS.length };
    var byId = {}; QS.forEach(function (q) { byId[q.id] = q; });

    // bộ nhớ lâu dài
    var wrongSet = new Set(LS.get('sl_wrong', []));
    var bookmarks = new Set(LS.get('sl_bookmarks', []));
    function saveWrong() { LS.set('sl_wrong', [...wrongSet]); }
    function saveBk() { LS.set('sl_bookmarks', [...bookmarks]); }

    // theme
    (function () { var t = LS.get('sl_theme', null); if (t) document.documentElement.setAttribute('data-theme', t); })();
    $('btnTheme').onclick = function () {
      var cur = document.documentElement.getAttribute('data-theme');
      var isDark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next); LS.set('sl_theme', next);
    };

    // ================== TRẠNG THÁI PHIÊN ==================
    var S = null; // session hiện tại

    function buildSessionItem(q, shuffleA) {
      var order = q.options.map(function (_, i) { return i; });
      if (shuffleA) order = shuffle(order);
      return { q: q, order: order, selected: null, answered: false };
    }

    function startQuiz(pool, opts) {
      opts = opts || {};
      var mode = opts.mode || currentMode;
      var list = pool.slice();
      if (opts.shuffleQ !== false && $('chkShuffleQ').checked) list = shuffle(list);
      var n = parseInt($('selCount').value, 10);
      if (opts.count != null) n = opts.count;
      if (n > 0 && list.length > n) list = list.slice(0, n);
      var shuffleA = $('chkShuffleA').checked;
      S = {
        items: list.map(function (q) { return buildSessionItem(q, shuffleA); }),
        current: 0, mode: mode, title: opts.title || 'Luyện tập',
        startTime: Date.now(), timer: null
      };
      if (list.length === 0) { alert('Không có câu hỏi phù hợp.'); return; }
      show('quiz');
      $('quizTopic').textContent = S.title + ' · ' + (mode === 'exam' ? 'Chế độ THI THỬ' : 'Chế độ luyện tập');
      $('cTotal').textContent = S.items.length;
      if (mode === 'exam') { $('timerWrap').classList.remove('hidden'); startTimer(); }
      else $('timerWrap').classList.add('hidden');
      renderQ();
    }

    function startTimer() {
      clearInterval(S.timer);
      S.timer = setInterval(function () {
        var s = Math.floor((Date.now() - S.startTime) / 1000);
        $('timer').textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
      }, 500);
    }

    function renderQ() {
      var it = S.items[S.current], q = it.q;
      $('cIndex').textContent = S.current + 1;
      $('bar').style.width = ((S.current + 1) / S.items.length * 100) + '%';
      $('qLabel').textContent = q.topic;
      $('exceptBadge').classList.toggle('hidden', !q.isExcept);
      // hiển thị câu hỏi (bỏ tiền tố "Câu N." cho gọn nhưng vẫn giữ nếu muốn)
      $('qText').textContent = q.question;
      // bookmark
      $('bkToggle').textContent = bookmarks.has(q.id) ? '★ Đã lưu' : '☆ Lưu câu này';

      var wrap = $('answers'); wrap.innerHTML = '';
      it.order.forEach(function (origIdx, pos) {
        var b = document.createElement('button');
        b.className = 'answer';
        b.innerHTML = '<span class="key">' + LETTERS[pos] + '</span><span>' + esc(q.options[origIdx]) + '</span>';
        b.onclick = function () { choose(pos); };
        wrap.appendChild(b);
      });
      applyState();
      updateScore();
      // nút điều hướng
      $('btnPrev').disabled = S.current === 0;
      var last = S.current === S.items.length - 1;
      $('btnNext').classList.toggle('hidden', last);
      $('btnFinish').classList.toggle('hidden', !last);
    }

    function choose(pos) {
      var it = S.items[S.current], q = it.q;
      if (S.mode === 'practice' && it.answered) return; // luyện tập: chốt sau khi chọn
      it.selected = pos;
      if (S.mode === 'practice') {
        it.answered = true;
        var origIdx = it.order[pos];
        if (q.answers.indexOf(origIdx) < 0) { wrongSet.add(q.id); saveWrong(); }
        else { wrongSet.delete(q.id); saveWrong(); }
      }
      applyState();
      updateScore();
    }

    function applyState() {
      var it = S.items[S.current], q = it.q;
      var nodes = $('answers').children;
      var fb = $('feedback'); fb.textContent = ''; fb.className = '';
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i]; el.className = 'answer';
        var origIdx = it.order[i];
        var isCorrect = q.answers.indexOf(origIdx) >= 0;
        if (S.mode === 'practice' && it.answered) {
          el.classList.add('locked');
          if (isCorrect) el.classList.add('correct');
          if (i === it.selected && !isCorrect) el.classList.add('wrong');
        } else {
          if (i === it.selected) el.classList.add('chosen');
        }
      }
      if (S.mode === 'practice' && it.answered) {
        var ok = q.answers.indexOf(it.order[it.selected]) >= 0;
        fb.textContent = ok ? '✅ Chính xác! Hay quá ta!!!' : '❌ Tẹt tẹt! Sai mất rồi!!!';
        fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
      }
    }

    function updateScore() {
      var c = 0, w = 0;
      S.items.forEach(function (it) {
        if (it.selected == null) return;
        var ok = it.q.answers.indexOf(it.order[it.selected]) >= 0;
        // ở chế độ thi, chỉ tính khi đã nộp; trước khi nộp vẫn cho xem tiến độ chọn
        if (S.mode === 'practice') { if (it.answered) { ok ? c++ : w++; } }
      });
      $('sCorrect').textContent = c; $('sWrong').textContent = w;
    }

    function go(delta) {
      var n = S.current + delta;
      if (n < 0 || n >= S.items.length) return;
      S.current = n; renderQ();
    }

    function finish() {
      clearInterval(S.timer);
      var c = 0, w = 0, un = 0, wrongItems = [];
      S.items.forEach(function (it) {
        if (it.selected == null) { un++; wrongSet.add(it.q.id); wrongItems.push(it); return; }
        var ok = it.q.answers.indexOf(it.order[it.selected]) >= 0;
        if (ok) { c++; wrongSet.delete(it.q.id); }
        else { w++; wrongSet.add(it.q.id); wrongItems.push(it); }
      });
      saveWrong();
      show('result');
      var total = S.items.length;
      var pct = Math.round(c / total * 100);
      $('rScore').textContent = c + '/' + total + '  (' + pct + '%)';
      var extra = un ? (' · ⏭ Bỏ trống: ' + un) : '';
      $('rBreak').innerHTML = '<span class="ok">✅ Đúng ' + c + '</span><span class="bad">❌ Sai ' + w + '</span>' + (un ? '<span class="muted">' + extra + '</span>' : '');
      // review câu sai
      var rev = $('review'); rev.innerHTML = wrongItems.length ? '<h3 style="margin:8px 4px">Xem lại câu chưa đúng (' + wrongItems.length + ')</h3>' : '<div class="card" style="text-align:center">🎉 Tuyệt vời, không có câu nào sai!</div>';
      wrongItems.forEach(function (it) {
        var q = it.q;
        var card = document.createElement('div'); card.className = 'card';
        var html = '<div class="muted small">' + esc(q.topic) + (q.isExcept ? ' · <b>NGOẠI TRỪ</b>' : '') + '</div>';
        html += '<div class="qtext">' + esc(q.question) + '</div>';
        q.options.forEach(function (op, idx) {
          var cls = 'answer locked'; var mark = '';
          if (q.answers.indexOf(idx) >= 0) { cls += ' correct'; mark = ' ✔'; }
          if (it.selected != null && it.order[it.selected] === idx && q.answers.indexOf(idx) < 0) { cls += ' wrong'; mark = ' ✘ (bạn chọn)'; }
          html += '<div class="' + cls + '"><span>' + esc(op) + mark + '</span></div>';
        });
        if (it.selected == null) html += '<div class="feedback bad">Bạn chưa trả lời câu này.</div>';
        card.innerHTML = html; rev.appendChild(card);
      });
      window.scrollTo(0, 0);
      refreshHome();
    }

    // ================== ĐIỀU HƯỚNG MÀN HÌNH ==================
    function show(name) {
      ['home', 'quiz', 'result'].forEach(function (s) { $(s).classList.toggle('hidden', s !== name); });
      if (name === 'home') refreshHome();
      window.scrollTo(0, 0);
    }

    // ================== TRANG CHỦ ==================
    var currentMode = 'practice';
    $('segMode').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      currentMode = b.dataset.mode;
      [].forEach.call(this.children, function (x) { x.classList.toggle('active', x === b); });
    });

    function refreshHome() {
      $('homeStats').innerHTML = '📚 <b>' + META.total + '</b> câu hỏi · ' + META.topics.length + ' chủ đề' +
        (META.skipped ? (' · <span class="muted">(' + META.skipped + ' câu bị bỏ do thiếu đáp án - NƠRON VÀ SYNAP - SINH LÝ TẾ BÀO)</span>') : '');
      $('wrongCount').textContent = wrongSet.size;
      var g = $('topicGrid'); g.innerHTML = '';
      META.topics.forEach(function (t) {
        if (!t.count) return;
        var d = document.createElement('div'); d.className = 'topic';
        d.innerHTML = '<b>' + esc(t.name) + '</b><span class="chip">' + t.count + ' câu</span>';
        d.onclick = function () {
          var pool = QS.filter(function (q) { return q.topic === t.name; });
          startQuiz(pool, { title: t.name, mode: currentMode });
        };
        g.appendChild(d);
      });
    }

    $('btnAll').onclick = function () { startQuiz(QS, { title: 'Tất cả chủ đề', mode: currentMode }); };
    $('btnWrong').onclick = function () {
      var pool = QS.filter(function (q) { return wrongSet.has(q.id); });
      if (!pool.length) { alert('Chưa có câu sai nào được lưu. Hãy làm bài trước nhé!'); return; }
      startQuiz(pool, { title: 'Ôn câu đã sai', mode: currentMode, count: 0 });
    };
    $('btnBookmarks').onclick = function () {
      var pool = QS.filter(function (q) { return bookmarks.has(q.id); });
      if (!pool.length) { alert('Bạn chưa lưu câu nào. Bấm "Lưu câu này" khi đang làm bài.'); return; }
      startQuiz(pool, { title: 'Câu đã lưu', mode: currentMode, count: 0 });
    };
    $('search').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var kw = this.value.trim().toLowerCase(); if (!kw) return;
      var pool = QS.filter(function (q) {
        if (q.question.toLowerCase().indexOf(kw) >= 0) return true;
        return q.options.some(function (o) { return o.toLowerCase().indexOf(kw) >= 0; });
      });
      if (!pool.length) { alert('Không tìm thấy câu nào chứa: ' + kw); return; }
      startQuiz(pool, { title: 'Tìm: "' + this.value.trim() + '"', mode: currentMode, count: 0 });
    });

    // ================== NÚT QUIZ ==================
    $('btnNext').onclick = function () { go(1); };
    $('btnPrev').onclick = function () { go(-1); };
    $('btnFinish').onclick = finish;
    $('btnHome2').onclick = function () { if (confirm('Thoát ra trang chủ? Tiến trình bài này sẽ không được lưu.')) { clearInterval(S && S.timer); show('home'); } };
    $('btnHome3').onclick = function () { show('home'); };
    $('btnRestart').onclick = function () { startQuiz(S.items.map(function (it) { return it.q; }), { title: S.title, mode: S.mode, count: 0, shuffleQ: true }); };
    $('btnRetryWrong').onclick = function () {
      var pool = QS.filter(function (q) { return wrongSet.has(q.id); });
      if (!pool.length) { alert('Không còn câu sai nào!'); return; }
      startQuiz(pool, { title: 'Ôn câu đã sai', mode: S.mode, count: 0 });
    };
    $('bkToggle').onclick = function () {
      var q = S.items[S.current].q;
      if (bookmarks.has(q.id)) bookmarks.delete(q.id); else bookmarks.add(q.id);
      saveBk(); $('bkToggle').textContent = bookmarks.has(q.id) ? '★ Đã lưu' : '☆ Lưu câu này';
    };

    // ================== PHÍM TẮT ==================
    document.addEventListener('keydown', function (e) {
      if ($('quiz').classList.contains('hidden')) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      var it = S.items[S.current];
      if (e.key === 'ArrowRight' || e.key === 'Enter') { if (!$('btnNext').classList.contains('hidden')) go(1); else finish(); e.preventDefault(); return; }
      if (e.key === 'ArrowLeft') { go(-1); return; }
      if (e.key === 's' || e.key === 'S') { $('bkToggle').click(); return; }
      var k = e.key.toUpperCase();
      var n = it.order.length;
      if (/^[1-9]$/.test(e.key)) { var i = +e.key - 1; if (i < n) choose(i); }
      else if (k >= 'A' && k <= 'Z') { var j = LETTERS.indexOf(k); if (j >= 0 && j < n) choose(j); }
    });

    // khởi động
    refreshHome();
    show('home');
  </script>
